name: Run Hibernate ORM integration tests

on:
  workflow_dispatch:
  # The push trigger moved to the CodeBuild variant run-hibernate-orm-tests-codebuild.yml.
  # push:
  #   branches:
  #     - main
  #     - main-2.x

permissions:
  contents: read

jobs:
  hibernate-integration-tests:
    name: 'Run Hibernate ORM integration tests [${{ matrix.engine }}]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Split by engine like run-hibernate-orm-tests-codebuild.yml; see the reason there.
      matrix:
        engine: [ mysql, pg ]
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: 'Get changed files'
        id: changed-files-specific
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files_yaml: |
            doc:
              - '**/*.md'
              - '**/docs/**'
              - '**/*.jpg'
              - '**/*.png'
      - name: 'Check changed files'
        id: changed-files
        if: ${{steps.changed-files-specific.outputs.doc_only_changed == 'false' && steps.changed-files-specific.outputs.doc_only_modified == 'false'}}
        run: echo "ONLY_DOCS=false" >> $GITHUB_OUTPUT
      - name: 'Set up JDK 24'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          distribution: 'corretto'
          java-version: 24
      - name: 'Run Hibernate ORM integration tests'
        if: ${{steps.changed-files.outputs.ONLY_DOCS && steps.changed-files.outputs.ONLY_DOCS == 'false'}}
        run: |
          ./gradlew --no-parallel --no-daemon test-hibernate-only \
            -Dtest-no-mysql-engine=${{ matrix.engine != 'mysql' }} \
            -Dtest-no-pg-engine=${{ matrix.engine != 'pg' }}
      - name: Mask data
        if: ${{ !cancelled() }}
        run: |
          ./gradlew --no-parallel --no-daemon maskJunitHtmlReport
      - name: 'Archive junit results'
        if: ${{steps.changed-files.outputs.ONLY_DOCS && steps.changed-files.outputs.ONLY_DOCS == 'false' && !cancelled()}}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-report-${{ matrix.engine }}
          path: ./wrapper/build/test-results
          retention-days: 5
      - name: 'Archive html summary report'
        if: ${{steps.changed-files.outputs.ONLY_DOCS && steps.changed-files.outputs.ONLY_DOCS == 'false' && !cancelled()}}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: html-summary-report-${{ matrix.engine }}
          path: ./wrapper/build/report
          retention-days: 5
      - name: 'Archive container reports'
        if: ${{steps.changed-files.outputs.ONLY_DOCS && steps.changed-files.outputs.ONLY_DOCS == 'false' && !cancelled()}}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: container-reports-${{ matrix.engine }}
          path: ./wrapper/build/test-results/*.tar.gz
          retention-days: 5
