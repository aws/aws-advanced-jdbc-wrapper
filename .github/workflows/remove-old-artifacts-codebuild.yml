# CodeBuild variant of remove-old-artifacts.yml.
#
# Runs the same jobs on the self-hosted CodeBuild runners instead of GitHub-hosted ones.
# Triggers: manual dispatch, plus the schedule moved here from remove-old-artifacts.yml.
# There is deliberately no push or pull_request trigger: this repository is public and these
# self-hosted runners hold AWS credentials, so they must never run code from a fork's pull request.

name: Remove Old Artifacts (CodeBuild)

on:
  workflow_dispatch:
  schedule:
    # Every day at 01:17 UTC (6:17 PM PDT / 5:17 PM PST the previous day).
    - cron: '17 1 * * *'

permissions:
  contents: read

jobs:
  remove-old-artifacts:
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      actions: write
    timeout-minutes: 10

    steps:
      - name: Remove Old Artifacts
        uses: c-hive/gha-remove-artifacts@62c2fbea931baa7dd4a6b73ea5a799984a818f61  # v1
        with:
          age: '1 week'
          skip-tags: true
