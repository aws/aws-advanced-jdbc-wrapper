name: Run Aurora Postgres Advanced Performance Tests

on:
  workflow_dispatch:

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

concurrency:
  # These workflows create real RDS clusters and whitelist the runner's IP in the region's
  # default security group. Running two of them at once risks exhausting the security group
  # rule quota (60 inbound rules per group) and the DB cluster/instance quotas, since a single
  # sharded run already claims 20 clusters and 20 rules. Every GitHub-hosted quota-consuming
  # workflow shares this group. The CodeBuild variants use rds-integration-tests-codebuild, which
  # does not wait for this one (see the caution in run-integration-tests-latest-codebuild.yml).
  # Runs in this group execute one at a time; with `queue: max`, later runs wait in
  # FIFO order (up to 100 pending) instead of being cancelled.
  group: rds-integration-tests
  queue: max

jobs:
  aurora-postgres-performance-tests:
    concurrency:
      # Runs in this group execute one at a time; with `queue: max`, later runs wait in FIFO order
      # (up to 100 pending) instead of being cancelled.
      group: AdvancedPerformanceTests-Aurora
      queue: max
    name: 'Run Aurora Postgres container advanced performance tests'
    runs-on: ubuntu-latest
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50
      - name: 'Set up JDK 8'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'corretto'
          java-version: 8
      - name: 'Configure AWS credentials'
        id: creds
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: run_adv_perf_test_pgsql
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          output-credentials: true
      - name: 'Run performance tests (OpenJDK)'
        run: |
          ./gradlew --no-parallel --no-daemon test-aurora-pg-advanced-performance
        env:
          AURORA_CLUSTER_DOMAIN: ${{ secrets.DB_CONN_SUFFIX }}
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
          MYSQL_VERSION: "default"
          PG_VERSION: "default"
      - name: 'Archive Performance Results'
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: 'performance-results'
          path: ./wrapper/build/reports/tests/
          retention-days: 5
