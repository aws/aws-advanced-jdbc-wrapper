# CodeBuild variant of dependabot-auto-merge.yml.
#
# Runs the same job on the self-hosted CodeBuild runners instead of GitHub-hosted ones.
# Triggers: the same as dependabot-auto-merge.yml (pull_request to main and main-2.x). That
# trigger is commented out in dependabot-auto-merge.yml, so each PR to main runs only this copy.
# Dependabot opens PRs against main only (.github/dependabot.yml); a PR to main-2.x would use
# main-2.x's own workflow files and run the GitHub-hosted original there.
# pull_request: the job checks out no code, and its `if:` skips it, before any runner starts, for
# every PR not authored by Dependabot, so a fork PR never gets one of these runners from here.
# Beyond that, the repository requires maintainer approval before workflows run for all external
# contributors.
# The gh CLI used below ships with the CodeBuild image (aws/codebuild/amazonlinux-x86_64-standard:6.0
# installs it from cli.github.com), so the steps are unchanged.

name: Dependabot Automerge (CodeBuild)

# SECURITY: the trigger below must stay `pull_request` and must NOT be changed to
# `pull_request_target`. With `pull_request`, a fork PR gets a read-only GITHUB_TOKEN and no
# access to secrets, so the approve/merge steps cannot be driven by an outside contributor even
# if the actor gate below were bypassed. `pull_request_target` would run with a writable token
# in the context of the base repository and turn this workflow into an arbitrary-code-push
# primitive. See https://www.synacktiv.com/publications/github-actions-exploitation-dependabot
on:
  pull_request:
    branches:
      - 'main'
      - 'main-2.x'

permissions:
  contents: read

jobs:
  dependabot-automerge:
    permissions:
      contents: write
      pull-requests: write
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    # SECURITY: gate on the PR author, not on `github.actor`. `github.actor` is the last identity
    # to have acted on the pull request, so an attacker can flip it to 'dependabot[bot]' by
    # opening a PR from a fork branch and then getting Dependabot to force-push on that branch.
    # `github.event.pull_request.user.login` is the immutable author of the PR and cannot be
    # spoofed from a fork. The `dependabot/fetch-metadata` step below performs the same author
    # check internally; this condition makes the guarantee explicit rather than incidental.
    # Also require Dependabot to be the one who triggered this run. When a maintainer rebases or
    # updates a Dependabot PR, the new head commit is no longer signed by Dependabot, and
    # fetch-metadata refuses to proceed ("Dependabot's commit signature is not verified") and fails
    # the job, as in run 38828313702 on PR #2172. Skipping those runs avoids a misleading failure;
    # comment `@dependabot rebase` to get a signed commit that this job then handles. This only
    # narrows the author gate above, so it cannot widen what an outside contributor can trigger.
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.actor == 'dependabot[bot]'

    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Approve PR
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Enable PR auto-merge
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
