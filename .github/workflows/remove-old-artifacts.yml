name: Remove Old Artifacts

on:
  # Manual dispatch only, so the file stays a valid workflow now that its schedule has moved.
  workflow_dispatch:
  # The schedule moved to the CodeBuild variant remove-old-artifacts-codebuild.yml.
  # schedule:
  #   # Every day at 1am
  #   - cron: '0 1 * * *'

permissions:
  contents: read

jobs:
  remove-old-artifacts:
    runs-on: ubuntu-latest
    permissions:
      actions: write
    timeout-minutes: 10

    steps:
      - name: Remove Old Artifacts
        uses: c-hive/gha-remove-artifacts@62c2fbea931baa7dd4a6b73ea5a799984a818f61  # v1
        with:
          age: '1 week'
          skip-tags: true
