# CodeBuild variant of run-hibernate-orm-tests.yml.
#
# Runs the same jobs on the self-hosted CodeBuild runners instead of GitHub-hosted ones.
# Triggers: the same as run-hibernate-orm-tests.yml (manual dispatch, push to main and main-2.x).
# The push trigger is commented out in run-hibernate-orm-tests.yml, so each push to main runs only
# this copy. Pushes to main-2.x use main-2.x's own workflow files, so they keep running the
# GitHub-hosted original until this change is backported there.

name: Run Hibernate ORM integration tests (CodeBuild)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - main-2.x

permissions:
  contents: read

env:
  # The CodeBuild runners share outbound IPs and have no Docker Hub credentials, so take the
  # Testcontainers images from ECR Public, which does not rate limit anonymous pulls.
  TEST_CONTAINER_REGISTRY: ecr

  # The runner and its Docker daemon share one container, so Testcontainers would otherwise use
  # the bridge gateway 172.18.0.1, where a published port with no listener (the test container's
  # debug port 5005) is unreachable. Probe run 38786644908 reached every published port at localhost.
  TESTCONTAINERS_HOST_OVERRIDE: localhost

jobs:
  hibernate-integration-tests:
    name: 'Run Hibernate ORM integration tests'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: 'Get changed files'
        id: changed-files-specific
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files_yaml: |
            doc:
              - '**/*.md'
              - '**/docs/**'
              - '**/*.jpg'
              - '**/*.png'
      - name: 'Check changed files'
        id: changed-files
        if: ${{steps.changed-files-specific.outputs.doc_only_changed == 'false' && steps.changed-files-specific.outputs.doc_only_modified == 'false'}}
        run: echo "ONLY_DOCS=false" >> $GITHUB_OUTPUT
      - name: 'Set up JDK 24'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'corretto'
          java-version: 24
      - name: 'Run Hibernate ORM integration tests'
        if: ${{steps.changed-files.outputs.ONLY_DOCS && steps.changed-files.outputs.ONLY_DOCS == 'false'}}
        run: |
          ./gradlew --no-parallel --no-daemon test-hibernate-only
      - name: Mask data
        run: |
          ./gradlew --no-parallel --no-daemon maskJunitHtmlReport
      - name: 'Archive junit results'
        if: ${{steps.changed-files.outputs.ONLY_DOCS && steps.changed-files.outputs.ONLY_DOCS == 'false' && !cancelled()}}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-report
          path: ./wrapper/build/test-results
          retention-days: 5
      - name: 'Archive html summary report'
        if: ${{steps.changed-files.outputs.ONLY_DOCS && steps.changed-files.outputs.ONLY_DOCS == 'false' && !cancelled()}}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: html-summary-report
          path: ./wrapper/build/report
          retention-days: 5
      - name: 'Archive container reports'
        if: ${{steps.changed-files.outputs.ONLY_DOCS && steps.changed-files.outputs.ONLY_DOCS == 'false' && !cancelled()}}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: container-reports
          path: ./wrapper/build/test-results/*.tar.gz
          retention-days: 5
