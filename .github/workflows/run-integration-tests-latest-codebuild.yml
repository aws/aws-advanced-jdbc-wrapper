# CodeBuild variant of run-integration-tests-latest.yml.
#
# Runs the same jobs on the self-hosted CodeBuild runners instead of GitHub-hosted ones.
# Manual dispatch only: the original keeps the schedule trigger, so this copy never
# provisions a second set of RDS clusters alongside it. It uses its own concurrency group, so a
# run here waits only behind other CodeBuild RDS workflows - see the caution on that group below.

name: Run Aurora Integration Tests Latest (CodeBuild)

on:
  workflow_dispatch:

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

# Each matrix entry below pins itself to exactly ONE test environment and runs ONE shard of the
# integration test classes against its own database cluster, so the whole suite runs in parallel
# instead of one engine at a time. 20 entries => at most 20 concurrent clusters / 50 DB instances,
# and 20 inbound rules in the region's default security group (quota is 60 per security group).
#
# Shard counts are sized from the per-environment totals measured in run 30645460736, and the
# per-class weight table in wrapper/src/test/build.gradle.kts keeps the shards within a group evenly
# sized. Class-to-shard assignment is computed there from the compiled classes on disk, so adding a
# test class needs no change here. Projected critical path is ~54 min (mysql-aurora-mariadb-3inst).
#
# The 2-instance Aurora environment is NOT covered here - it is a near-duplicate of the 3-instance
# one and is exercised by run-integration-tests-full-matrix-weekly.yml instead.
concurrency:
  # All CodeBuild RDS workflows share this group, so CodeBuild runs still serialize against each
  # other and only one sharded run at a time claims its 20 clusters / 20 security-group rules.
  # They deliberately no longer serialize against the GitHub-hosted workflows in the
  # `rds-integration-tests` group: a CodeBuild dispatch provisions its own runner, so it should
  # not inherit the GitHub runner queue.
  # CAUTION: a CodeBuild dispatch can therefore overlap a GitHub-hosted RDS run. Two sharded
  # suites at once means ~40 DB clusters / ~100 DB instances and twice the inbound rules in the
  # region's default security group, which can exceed the account's quotas. Until the CodeBuild
  # suite targets its own AWS region (independent quotas), do not dispatch it while a
  # GitHub-hosted RDS workflow is running.
  group: rds-integration-tests-codebuild

env:
  # The CodeBuild runners share an outbound IP and have no Docker Hub credentials, so take the
  # Testcontainers images from ECR Public, which does not rate limit anonymous pulls.
  TEST_CONTAINER_REGISTRY: ecr

  # The test host does not manage the security group rule on this fleet. Every job here leaves
  # through the same NAT gateway address, so a per-job rule has 20 independent owners and the first
  # job to finish revokes the rule its siblings are still connected through. The authorize-runner-ip
  # job below adds the rule once before the matrix starts and revoke-runner-ip removes it once after
  # the matrix finishes, scoped to this run and to the database ports. Nothing has to be
  # allow-listed by hand.
  SKIP_IP_AUTHORIZATION: true

jobs:
  # Opens the region's default security group for this run's egress address, once for all 20 matrix
  # jobs. This has to run ON THE FLEET: a GitHub-hosted setup job would ask checkip.amazonaws.com
  # for its OWN address and authorize the wrong /32. Every job on the fleet shares the same NAT
  # egress address, so discovering it once here is valid for all of them.
  authorize-runner-ip:
    name: 'Authorize runner IP'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      ipv4: ${{ steps.ip.outputs.ipv4 }}
    steps:
      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        id: creds
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: authorize_runner_ip_latest
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          output-credentials: true
      - name: 'Discover the fleet egress IP address'
        id: ip
        run: |
          ipv4=$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]')
          if [ -z "$ipv4" ]; then
            echo "::error::checkip.amazonaws.com returned no address, so the runner's egress IP is unknown and the test databases would be unreachable."
            exit 1
          fi
          echo "Runner egress IP address: $ipv4"
          echo "ipv4=$ipv4" >> $GITHUB_OUTPUT

      # Only TCP 3306 (MySQL / MariaDB) and TCP 5432 (PostgreSQL) are opened, the only ports the
      # harness reaches over the network: TestEnvironment.getPort() returns 3306 for MYSQL/MARIADB
      # and 5432 for PG, and the clusters are created without a custom port. Everything else the
      # tests talk to (Toxiproxy 8666/8474, Valkey 6379/6380) runs in a container on the runner
      # itself. Deliberately NOT the all-protocols, ports 0-65535 rule
      # AuroraTestUtility.ec2AuthorizeIP creates: a standing all-ports rule trips port-restriction
      # compliance checks such as AWS Config's vpc-sg-open-only-to-authorized-ports.
      #
      # The description must not start with "Test run at ":
      # AuroraTestUtility.securityGroupRulesCleanUp() only ever considers inbound rules whose
      # description starts with that prefix and parses as an instant older than 12 hours, so a rule
      # described this way is never examined by that sweep and cannot be deleted under a running job.
      - name: 'Authorize the fleet egress IP address'
        run: |
          ipv4='${{ steps.ip.outputs.ipv4 }}'
          description="CodeBuild run ${{ github.run_id }} - integration tests"
          for port in 3306 5432; do
            permissions=$(printf \
              '[{"IpProtocol":"tcp","FromPort":%s,"ToPort":%s,"IpRanges":[{"CidrIp":"%s/32","Description":"%s"}]}]' \
              "$port" "$port" "$ipv4" "$description")
            if output=$(aws ec2 authorize-security-group-ingress \
                --group-name default --ip-permissions "$permissions" 2>&1); then
              echo "Authorized TCP $port from $ipv4/32."
            elif [ "${output#*InvalidPermission.Duplicate}" != "$output" ]; then
              # A rule leaked by an earlier run that never reached its cleanup job. It already
              # grants what this run needs, so treat it as authorized rather than failing here.
              echo "TCP $port from $ipv4/32 was already authorized."
            else
              echo "$output"
              exit 1
            fi
          done

  all-integration-tests-latest:
    name: 'Latest / ${{ matrix.name }}'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    needs: authorize-runner-ip
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- Aurora PG, 3 instances: 95.6 min of tests -> 3 shards (~47 min)
          - { name: pg-aurora-3inst-1of3, task: test-all-pg-aurora, envArgs: '-Dtest-no-instances-1=true', shard: 1, shardCount: 3 }
          - { name: pg-aurora-3inst-2of3, task: test-all-pg-aurora, envArgs: '-Dtest-no-instances-1=true', shard: 2, shardCount: 3 }
          - { name: pg-aurora-3inst-3of3, task: test-all-pg-aurora, envArgs: '-Dtest-no-instances-1=true', shard: 3, shardCount: 3 }
          # --- Aurora PG, single instance: 4.9 min of tests -> 1 shard
          - { name: pg-aurora-1inst, task: test-all-pg-aurora, envArgs: '-Dtest-no-instances-3=true', shard: 1, shardCount: 1 }

          # --- Aurora MySQL (MySQL driver), 3 instances: 126.8 min -> 4 shards (~47 min)
          - { name: mysql-aurora-3inst-1of4, task: test-all-mysql-aurora, envArgs: '-Dtest-no-instances-1=true', shard: 1, shardCount: 4 }
          - { name: mysql-aurora-3inst-2of4, task: test-all-mysql-aurora, envArgs: '-Dtest-no-instances-1=true', shard: 2, shardCount: 4 }
          - { name: mysql-aurora-3inst-3of4, task: test-all-mysql-aurora, envArgs: '-Dtest-no-instances-1=true', shard: 3, shardCount: 4 }
          - { name: mysql-aurora-3inst-4of4, task: test-all-mysql-aurora, envArgs: '-Dtest-no-instances-1=true', shard: 4, shardCount: 4 }
          - { name: mysql-aurora-1inst, task: test-all-mysql-aurora, envArgs: '-Dtest-no-instances-3=true', shard: 1, shardCount: 1 }

          # --- Aurora MySQL (MariaDB driver), 3 instances: 114.8 min -> 3 shards (~54 min).
          #     This is the critical path; give it a 4th shard first if more clusters become available.
          - { name: mysql-aurora-mariadb-3inst-1of3, task: test-all-mysql-aurora-mariadb-driver, envArgs: '-Dtest-no-instances-1=true', shard: 1, shardCount: 3 }
          - { name: mysql-aurora-mariadb-3inst-2of3, task: test-all-mysql-aurora-mariadb-driver, envArgs: '-Dtest-no-instances-1=true', shard: 2, shardCount: 3 }
          - { name: mysql-aurora-mariadb-3inst-3of3, task: test-all-mysql-aurora-mariadb-driver, envArgs: '-Dtest-no-instances-1=true', shard: 3, shardCount: 3 }
          - { name: mysql-aurora-mariadb-1inst, task: test-all-mysql-aurora-mariadb-driver, envArgs: '-Dtest-no-instances-3=true', shard: 1, shardCount: 1 }

          # --- RDS Multi-AZ MySQL cluster: 97.1 min -> 3 shards (~50 min)
          - { name: mysql-multi-az-cluster-1of3, task: test-all-mysql-multi-az, envArgs: '-Dtest-no-multi-az-instance=true', shard: 1, shardCount: 3 }
          - { name: mysql-multi-az-cluster-2of3, task: test-all-mysql-multi-az, envArgs: '-Dtest-no-multi-az-instance=true', shard: 2, shardCount: 3 }
          - { name: mysql-multi-az-cluster-3of3, task: test-all-mysql-multi-az, envArgs: '-Dtest-no-multi-az-instance=true', shard: 3, shardCount: 3 }
          - { name: mysql-multi-az-instance, task: test-all-mysql-multi-az, envArgs: '-Dtest-no-multi-az-cluster=true', shard: 1, shardCount: 1 }

          # --- RDS Multi-AZ PG cluster: 44.2 min -> 2 shards (~43 min)
          - { name: pg-multi-az-cluster-1of2, task: test-all-pg-multi-az, envArgs: '-Dtest-no-multi-az-instance=true', shard: 1, shardCount: 2 }
          - { name: pg-multi-az-cluster-2of2, task: test-all-pg-multi-az, envArgs: '-Dtest-no-multi-az-instance=true', shard: 2, shardCount: 2 }
          - { name: pg-multi-az-instance, task: test-all-pg-multi-az, envArgs: '-Dtest-no-multi-az-cluster=true', shard: 1, shardCount: 1 }
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50
      - name: 'Set up JDK 8'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'corretto'
          java-version: 8
          cache: 'gradle'
      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        id: creds
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: run_integration_test_latest
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          output-credentials: true
      - name: Run integration tests
        run: |
          ./gradlew --no-parallel --no-daemon ${{ matrix.task }} \
            -Dtest-no-instances-2=true \
            -Dtest-no-instances-5=true \
            ${{ matrix.envArgs }} \
            -Dtest-shard-index=${{ matrix.shard }} \
            -Dtest-shard-count=${{ matrix.shardCount }}
        env:
          AURORA_CLUSTER_DOMAIN: ${{ secrets.DB_CONN_SUFFIX }}
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
          MYSQL_VERSION: "latest"
          PG_VERSION: "latest"
      - name: Mask data
        run: |
          ./gradlew --no-parallel --no-daemon maskJunitHtmlReport
      - name: Archive junit results for ${{ matrix.name }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-report-latest-${{ matrix.name }}
          path: ./wrapper/build/test-results
          retention-days: 5
      - name: Archive html summary report for ${{ matrix.name }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: html-summary-report-latest-${{ matrix.name }}
          path: ./wrapper/build/report
          retention-days: 5
      # There is deliberately no security-group cleanup step here. The rule belongs to the whole
      # run, not to this shard, so revoke-runner-ip below removes it once every shard has finished.

  # The single revoke for the whole run. A per-job revoke could not do this: all 20 jobs share one
  # egress address and therefore one rule, so whichever job finished first used to take the rule
  # away from the 19 still running (run 38657902325, where 17 jobs then failed with
  # java.net.ConnectException). This job runs after every shard has reported, whatever its outcome.
  revoke-runner-ip:
    name: 'Revoke runner IP'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    needs: [authorize-runner-ip, all-integration-tests-latest]
    if: always()
    steps:
      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        id: creds
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: revoke_runner_ip_latest
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          output-credentials: true
      - name: 'Revoke the fleet egress IP address'
        run: |
          ipv4='${{ needs.authorize-runner-ip.outputs.ipv4 }}'
          if [ -z "$ipv4" ]; then
            # authorize-runner-ip never got as far as publishing an address, so it authorized
            # nothing either and there is nothing to take away.
            echo "No authorized address was recorded for this run; nothing to revoke."
            exit 0
          fi
          for port in 3306 5432; do
            permissions=$(printf \
              '[{"IpProtocol":"tcp","FromPort":%s,"ToPort":%s,"IpRanges":[{"CidrIp":"%s/32"}]}]' \
              "$port" "$port" "$ipv4")
            if output=$(aws ec2 revoke-security-group-ingress \
                --group-name default --ip-permissions "$permissions" 2>&1); then
              # In a default VPC an unmatched revoke is not an error: the rules that were not found
              # come back under UnknownIpPermissions, so echo the response instead of claiming the
              # rule was there. A non-default VPC raises InvalidPermission.NotFound, handled below.
              echo "Revoke of TCP $port from $ipv4/32 accepted:"
              echo "$output"
            elif [ "${output#*InvalidPermission.NotFound}" != "$output" ]; then
              # Already gone - the rule was revoked by hand, or by a cleanup of an earlier attempt.
              # Nothing is left open, so do not fail the run over it.
              echo "TCP $port from $ipv4/32 was already revoked."
            else
              echo "$output"
              exit 1
            fi
          done
