name: Run Standard Integration Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - main-2.x
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**/release_draft.yml'
      - '**/maven*.yml'

permissions:
  contents: read

jobs:
  check-changes:
    name: 'Check for non-doc changes'
    runs-on: ubuntu-latest
    outputs:
      only_docs: ${{ steps.changed-files.outputs.ONLY_DOCS }}
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50
      - name: 'Get changed files'
        id: changed-files-specific
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files_yaml: |
            doc:
              - '**/*.md'
              - '**/docs/**'
              - '**/*.jpg'
              - '**/*.png'
      - name: 'Check changed files'
        id: changed-files
        run: |
          if [[ "${{ steps.changed-files-specific.outputs.doc_only_changed }}" == "true" || "${{ steps.changed-files-specific.outputs.doc_only_modified }}" == "true" ]]; then
            echo "ONLY_DOCS=true" >> $GITHUB_OUTPUT
          else
            echo "ONLY_DOCS=false" >> $GITHUB_OUTPUT
          fi

  docker-tests:
    name: 'Docker [${{ matrix.engine }}, ${{ matrix.jvm }}]'
    needs: check-changes
    if: ${{ needs.check-changes.outputs.only_docs == 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No mariadb: a MariaDB server is out of scope for the migrated tasks. The MariaDB driver is still
        # exercised, as its own axis against a MySQL engine, which is what the Aurora workflows pin.
        engine: [mysql, pg]
        # Named as TargetJvm names them, because that is what -Dorchestra-jvms takes.
        jvm: ${{ github.event_name == 'pull_request' && fromJSON('["OPENJDK8", "OPENJDK21"]') || fromJSON('["OPENJDK8", "OPENJDK11", "OPENJDK17", "OPENJDK21", "OPENJDK24", "GRAALVM"]') }}
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50
      # Two JDKs, and both are needed. The suite still compiles for Java 8, while the Orchestra runner that
      # provisions the environment is Java 17 class files and sets its own toolchain launcher - so a runner with
      # only JDK 8 fails to resolve that toolchain before any container starts. The JVM the tests actually run
      # on is neither of these: it is the container image the matrix selects.
      - name: 'Set up JDKs'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'corretto'
          java-version: |
            8
            17
      - name: 'Cache Gradle packages'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      # Orchestra provisions this environment. The axes are named directly rather than selected by switching
      # every other slot off, which is what the test-no-* negations did.
      - name: 'Run standard integration tests'
        run: |
          ./gradlew --no-parallel --no-daemon orchestra-test-docker \
            -Dorchestra-engines=${{ matrix.engine }} \
            -Dorchestra-jvms=${{ matrix.jvm }}
      - name: Mask data
        if: ${{ !cancelled() }}
        run: |
          ./gradlew --no-parallel --no-daemon maskJunitHtmlReport
      - name: 'Archive junit results'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-report-docker-${{ matrix.engine }}-${{ matrix.jvm }}
          path: ./wrapper/build/test-results
          retention-days: 5
      - name: 'Archive html summary report'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: html-summary-report-docker-${{ matrix.engine }}-${{ matrix.jvm }}
          path: ./wrapper/build/report
          retention-days: 5

  caching-tests:
    name: 'Caching [${{ matrix.engine }}, ${{ matrix.jvm }}]'
    needs: check-changes
    if: ${{ needs.check-changes.outputs.only_docs == 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # No mariadb: a MariaDB server is out of scope for the migrated tasks. The MariaDB driver is still
        # exercised, as its own axis against a MySQL engine, which is what the Aurora workflows pin.
        engine: [mysql, pg]
        # Named as TargetJvm names them, because that is what -Dorchestra-jvms takes.
        jvm: ${{ github.event_name == 'pull_request' && fromJSON('["OPENJDK8", "OPENJDK21"]') || fromJSON('["OPENJDK8", "OPENJDK11", "OPENJDK17", "OPENJDK21", "OPENJDK24", "GRAALVM"]') }}
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50
      # Two JDKs, and both are needed. The suite still compiles for Java 8, while the Orchestra runner that
      # provisions the environment is Java 17 class files and sets its own toolchain launcher - so a runner with
      # only JDK 8 fails to resolve that toolchain before any container starts. The JVM the tests actually run
      # on is neither of these: it is the container image the matrix selects.
      - name: 'Set up JDKs'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'corretto'
          java-version: |
            8
            17
      - name: 'Cache Gradle packages'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      # The same task and the same axes, with the caches added and the caching tag selected instead of
      # excluded. That is the whole difference between the two jobs, as it was between test-all-docker and
      # test-all-caching.
      - name: 'Run caching integration tests'
        run: |
          ./gradlew --no-parallel --no-daemon orchestra-test-docker \
            -Dorchestra-caching=true \
            -Dorchestra-engines=${{ matrix.engine }} \
            -Dorchestra-jvms=${{ matrix.jvm }}
      - name: Mask data
        if: ${{ !cancelled() }}
        run: |
          ./gradlew --no-parallel --no-daemon maskJunitHtmlReport
      - name: 'Archive junit results'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-report-caching-${{ matrix.engine }}-${{ matrix.jvm }}
          path: ./wrapper/build/test-results
          retention-days: 5
      - name: 'Archive html summary report'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: html-summary-report-caching-${{ matrix.engine }}-${{ matrix.jvm }}
          path: ./wrapper/build/report
          retention-days: 5

  integration-gate:
    name: 'Standard Integration Tests Gate'
    needs: [check-changes, docker-tests, caching-tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: 'Verify required jobs did not fail'
        run: |
          # Fail only if a needed job actually failed or was cancelled.
          # Skipped jobs (e.g. tests on doc-only PRs) are treated as passing,
          # so this gate is the single required status check for branch protection.
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" \
             || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed or were legitimately skipped."
