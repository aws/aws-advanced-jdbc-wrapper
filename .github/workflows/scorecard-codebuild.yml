# CodeBuild variant of scorecard.yml.
#
# Runs the same jobs on the self-hosted CodeBuild runners instead of GitHub-hosted ones.
# Triggers: manual dispatch only.
# There is deliberately no push or pull_request trigger: this repository is public and these
# self-hosted runners hold AWS credentials, so they must never run code from a fork's pull request.
# publish_results is false: the Scorecard API accepts results only from GitHub-hosted Ubuntu runners.
# So the schedule and push trigger stay on scorecard.yml, which keeps publishing the README badge.

name: OpenSSF Scorecard (CodeBuild)

on:
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: 'Run OpenSSF Scorecard'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    steps:
      - name: 'Clone Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Run Scorecard'
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: false
      - name: 'Upload Scorecard SARIF'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: scorecard-results.sarif
          retention-days: 5
