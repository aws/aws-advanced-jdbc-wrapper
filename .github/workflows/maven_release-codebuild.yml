# CodeBuild variant of maven_release.yml.
#
# Runs the same jobs on the self-hosted CodeBuild runners instead of GitHub-hosted ones.
# Trigger: release published. maven_release.yml is kept inactive, so this is the only workflow that
# publishes a release to Maven.
# The runners are ephemeral (one per job per run id), so they may hold signing and publishing secrets.
# No double publish: the release trigger is commented out in maven_release.yml, so each published
# release is published to Maven once, from here. A release runs the workflow files of its tag's
# commit, so only releases whose tag is on a commit that contains this file run it.

name: 'Release to Maven (CodeBuild)'

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  ubuntu-latest-jdbc-wrapper-release-to-maven:
    name: 'Build And Release to Maven'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 'Clone Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50
      # Does not gate anything - it records in the log which version this run published, so a
      # run can be audited afterwards without guessing.
      - name: 'Report the version being published'
        run: |
          set -euo pipefail
          prop() {
            # Trailing whitespace is stripped because .gitattributes marks the repository
            # 'text=auto'; a CRLF checkout would otherwise leave a carriage return behind.
            grep -E "^$1=" gradle.properties | cut -d= -f2 | tr -d '[:space:]'
          }
          major=$(prop 'aws-advanced-jdbc-wrapper\.version\.major')
          minor=$(prop 'aws-advanced-jdbc-wrapper\.version\.minor')
          subminor=$(prop 'aws-advanced-jdbc-wrapper\.version\.subminor')
          snapshot=$(prop 'snapshot')
          echo "event=${GITHUB_EVENT_NAME} checked out ref=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo detached) sha=$(git rev-parse HEAD)"
          echo "publishing version ${major}.${minor}.${subminor} (snapshot=${snapshot})"
          echo "### Publishing \`${major}.${minor}.${subminor}\` (snapshot=\`${snapshot}\`) from \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
      - name: 'Set up JDK 8'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'corretto'
          java-version: 8
      - name: 'Build Driver'
        run: |
          ./gradlew --no-parallel --no-daemon -x test build
          ./gradlew --no-parallel --no-daemon -x test shadowJar
      - name: "Decode Key Ring"
        run: |
          echo "${{secrets.GPG_SECRET_KEY_FILE}}" > ~/.gradle/secring.gpg.b64
          base64 -d ~/.gradle/secring.gpg.b64 > ~/.gradle/secring.gpg
      - name: 'Install GPG Secret Key'
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd  # v7
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}
      - name: 'Publish to Maven'
        run: |
          ./gradlew --no-parallel --no-daemon publishAllPublicationsToMavenRepository -Prelease=true -PjacocoEnabled=false -Psigning.keyId=${{secrets.GPG_KEY_ID}} -Psigning.password=${{secrets.GPG_PASSPHRASE}} -Psigning.secretKeyRingFile=$(echo ~/.gradle/secring.gpg)
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
      # The upload above only places files in a staging repository on the OSSRH Staging API.
      # They reach the Central Publisher Portal - and therefore Maven Central - only once that
      # repository is transferred, which is what this step does.
      - name: 'Transfer the upload to the Portal'
        run: ./gradlew --no-parallel --no-daemon postPublishToMaven
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
