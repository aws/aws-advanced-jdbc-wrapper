name: Run Blue/Green Integration Tests Latest

on:
  workflow_dispatch:
  schedule:
    # Every working day (Mon-Fri) at 8:00 PM PST (4:00 AM UTC next day)
    - cron: '0 4 * * 2-6'

permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

concurrency:
  # These workflows create real RDS clusters and whitelist the runner's IP in the region's
  # default security group. Running two of them at once risks exhausting the security group
  # rule quota (60 inbound rules per group) and the DB cluster/instance quotas, since a single
  # sharded run already claims 20 clusters and 20 rules. Every quota-consuming workflow shares
  # this group so only one runs at a time; `queue: max` makes the others wait their turn
  # instead of being cancelled (the default `queue: single` would drop them).
  group: rds-integration-tests
  queue: max

jobs:
  all-bg-integration-tests-latest:
    name: Run Blue/Green integration tests with latest engine version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        testTask: [ "mysql-aurora-mariadb-driver", "mysql-aurora-mysql-driver", "mysql-rds-instance-mariadb-driver", "mysql-rds-instance-mysql-driver", "pg-aurora", "pg-rds-instance" ]
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50
      - name: 'Set up JDK 8'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c  # v6.0.0
        with:
          distribution: 'corretto'
          java-version: 8
      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6
        id: creds
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: run_bg_integration_test_latest
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          output-credentials: true
      - name: Run Blue/Green integration tests
        run: |
          ./gradlew --no-parallel --no-daemon test-bgd-${{ matrix.testTask }}
        env:
          AURORA_CLUSTER_DOMAIN: ${{ secrets.DB_CONN_SUFFIX }}
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
          MYSQL_VERSION: "latest"
          PG_VERSION: "latest"
      - name: Mask data
        run: |
          ./gradlew --no-parallel --no-daemon maskJunitHtmlReport
      - name: Archive junit results for ${{ matrix.testTask }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: junit-report-latest-${{ matrix.testTask }}
          path: ./wrapper/build/test-results
          retention-days: 5
      - name: Archive html summary report for ${{ matrix.testTask }}
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: html-summary-report-latest-${{ matrix.testTask }}
          path: ./wrapper/build/report
          retention-days: 5
      # The test host records the address it whitelisted in the region's default security group (see
      # TestEnvironment.authorizeIP). Prefer that over asking checkip.amazonaws.com again: a
      # GitHub-hosted runner's egress address can change during a job, in which case a fresh lookup
      # revokes a rule that never existed and leaves the real one behind, consuming the group's
      # 60-rule quota. No recorded address means the test host either never authorized one or has
      # already revoked it, so there is nothing to clean up.
      - name: Get Github Action IP
        if: always()
        id: ip
        run: |
          ipFile=./wrapper/build/authorized-runner-ip.txt
          if [ -s "$ipFile" ]; then
            ipv4=$(tr -d '[:space:]' < "$ipFile")
            echo "Authorized runner IP recorded by the test host: $ipv4"
            echo "ipv4=$ipv4" >> $GITHUB_OUTPUT
          else
            echo "No authorized runner IP was recorded; nothing to revoke."
          fi
      - name: Remove Github Action IP
        if: always() && steps.ip.outputs.ipv4 != ''
        run: |
          aws ec2 revoke-security-group-ingress --group-name default --protocol all --port 0-65535 --cidr ${{ steps.ip.outputs.ipv4 }}/32
