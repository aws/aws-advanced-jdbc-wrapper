# CodeBuild variant of run-standard-integration-tests.yml.
#
# Runs the same jobs on the self-hosted CodeBuild runners instead of GitHub-hosted ones.
# Triggers: the same as run-standard-integration-tests.yml (manual dispatch, push to main and
# main-2.x, pull_request). The push and pull_request triggers are commented out in
# run-standard-integration-tests.yml, so each event on main runs only this copy. Pushes to main-2.x
# and PRs targeting it use main-2.x's own workflow files, so they keep running the GitHub-hosted
# original until this change is backported there.
# pull_request runs a fork PR's code on these self-hosted runners. In place: the repository requires
# maintainer approval before workflows run for all external contributors, and each job is a
# separate CodeBuild build. As on GitHub-hosted runners, a fork PR's run gets no secrets and no
# id-token: write. Residual risks: approved fork code can use the CodeBuild project's service role,
# and if the project uses a CodeBuild Docker server (one daemon shared by its builds), it can leave
# images there that later trusted jobs reuse; the Docker test jobs here pull and run images.
# The integration-gate job is named 'Standard Integration Tests Gate (CodeBuild)', a required status
# check on main. A required check matches the job name exactly, so renaming the job means updating
# branch protection too.

name: Run Standard Integration Tests (CodeBuild)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - main-2.x
  pull_request:
    branches:
      - '*'
    paths-ignore:
      - '**/release_draft.yml'
      - '**/maven*.yml'

permissions:
  contents: read

env:
  # The CodeBuild runners share outbound IPs and have no Docker Hub credentials, so take the
  # Testcontainers images from ECR Public, which does not rate limit anonymous pulls.
  TEST_CONTAINER_REGISTRY: ecr

  # The runner and its Docker daemon share one container, so Testcontainers would otherwise use
  # the bridge gateway 172.18.0.1, where a published port with no listener (the test container's
  # debug port 5005) is unreachable. Probe run 38786644908 reached every published port at localhost.
  TESTCONTAINERS_HOST_OVERRIDE: localhost

jobs:
  check-changes:
    name: 'Check for non-doc changes'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    outputs:
      only_docs: ${{ steps.changed-files.outputs.ONLY_DOCS }}
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50
      - name: 'Get changed files'
        id: changed-files-specific
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96  # v47.0.6
        with:
          files_yaml: |
            doc:
              - '**/*.md'
              - '**/docs/**'
              - '**/*.jpg'
              - '**/*.png'
      - name: 'Check changed files'
        id: changed-files
        run: |
          if [[ "${{ steps.changed-files-specific.outputs.doc_only_changed }}" == "true" || "${{ steps.changed-files-specific.outputs.doc_only_modified }}" == "true" ]]; then
            echo "ONLY_DOCS=true" >> $GITHUB_OUTPUT
          else
            echo "ONLY_DOCS=false" >> $GITHUB_OUTPUT
          fi

  docker-tests:
    name: 'Docker [${{ matrix.engine }}, ${{ matrix.jvm }}]'
    needs: check-changes
    if: ${{ needs.check-changes.outputs.only_docs == 'false' }}
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, pg, mariadb]
        jvm: ${{ github.event_name == 'pull_request' && fromJSON('["openjdk8", "openjdk21"]') || fromJSON('["openjdk8", "openjdk11", "openjdk17", "openjdk21", "openjdk24", "graalvm"]') }}
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50
      - name: 'Set up JDK 8'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'corretto'
          java-version: 8
      - name: 'Cache Gradle packages'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: 'Run standard integration tests'
        run: |
          ./gradlew --no-parallel --no-daemon test-all-docker \
            -Dtest-no-mysql-engine=${{ matrix.engine != 'mysql' }} \
            -Dtest-no-pg-engine=${{ matrix.engine != 'pg' }} \
            -Dtest-no-mariadb-engine=${{ matrix.engine != 'mariadb' }} \
            -Dtest-no-openjdk8=${{ matrix.jvm != 'openjdk8' }} \
            -Dtest-no-openjdk11=${{ matrix.jvm != 'openjdk11' }} \
            -Dtest-no-openjdk17=${{ matrix.jvm != 'openjdk17' }} \
            -Dtest-no-openjdk21=${{ matrix.jvm != 'openjdk21' }} \
            -Dtest-no-openjdk24=${{ matrix.jvm != 'openjdk24' }} \
            -Dtest-no-graalvm=${{ matrix.jvm != 'graalvm' }}
      - name: Mask data
        if: ${{ !cancelled() }}
        run: |
          ./gradlew --no-parallel --no-daemon maskJunitHtmlReport
      - name: 'Archive junit results'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-report-docker-${{ matrix.engine }}-${{ matrix.jvm }}
          path: ./wrapper/build/test-results
          retention-days: 5
      - name: 'Archive html summary report'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: html-summary-report-docker-${{ matrix.engine }}-${{ matrix.jvm }}
          path: ./wrapper/build/report
          retention-days: 5

  caching-tests:
    name: 'Caching [${{ matrix.engine }}, ${{ matrix.jvm }}]'
    needs: check-changes
    if: ${{ needs.check-changes.outputs.only_docs == 'false' }}
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        engine: [mysql, pg, mariadb]
        jvm: ${{ github.event_name == 'pull_request' && fromJSON('["openjdk8", "openjdk21"]') || fromJSON('["openjdk8", "openjdk11", "openjdk17", "openjdk21", "openjdk24", "graalvm"]') }}
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50
      - name: 'Set up JDK 8'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6  # v6.0.1
        with:
          distribution: 'corretto'
          java-version: 8
      - name: 'Cache Gradle packages'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: 'Run caching integration tests'
        run: |
          ./gradlew --no-parallel --no-daemon test-all-caching \
            -Dtest-no-mysql-engine=${{ matrix.engine != 'mysql' }} \
            -Dtest-no-pg-engine=${{ matrix.engine != 'pg' }} \
            -Dtest-no-mariadb-engine=${{ matrix.engine != 'mariadb' }} \
            -Dtest-no-openjdk8=${{ matrix.jvm != 'openjdk8' }} \
            -Dtest-no-openjdk11=${{ matrix.jvm != 'openjdk11' }} \
            -Dtest-no-openjdk17=${{ matrix.jvm != 'openjdk17' }} \
            -Dtest-no-openjdk21=${{ matrix.jvm != 'openjdk21' }} \
            -Dtest-no-openjdk24=${{ matrix.jvm != 'openjdk24' }} \
            -Dtest-no-graalvm=${{ matrix.jvm != 'graalvm' }}
      - name: Mask data
        if: ${{ !cancelled() }}
        run: |
          ./gradlew --no-parallel --no-daemon maskJunitHtmlReport
      - name: 'Archive junit results'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-report-caching-${{ matrix.engine }}-${{ matrix.jvm }}
          path: ./wrapper/build/test-results
          retention-days: 5
      - name: 'Archive html summary report'
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: html-summary-report-caching-${{ matrix.engine }}-${{ matrix.jvm }}
          path: ./wrapper/build/report
          retention-days: 5

  integration-gate:
    name: 'Standard Integration Tests Gate (CodeBuild)'
    needs: [check-changes, docker-tests, caching-tests]
    if: ${{ always() }}
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: 'Verify required jobs did not fail'
        run: |
          # Fail only if a needed job actually failed or was cancelled.
          # Skipped jobs (e.g. tests on doc-only PRs) are treated as passing,
          # so this gate is the single required status check for branch protection.
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" \
             || "${{ contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo "A required job failed or was cancelled."
            exit 1
          fi
          echo "All required jobs passed or were legitimately skipped."
