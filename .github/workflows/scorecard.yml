name: OpenSSF Scorecard

on:
  # The push and schedule triggers moved to the CodeBuild variant scorecard-codebuild.yml, which
  # cannot publish results (see its header). Uncomment them here to publish again.
  # push:
  #   branches:
  #     - main
  # schedule:
  #   - cron: '0 6 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  scorecard:
    name: 'Run OpenSSF Scorecard'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      actions: read
      contents: read
    steps:
      - name: 'Clone Repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: 'Run Scorecard'
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
      - name: 'Upload Scorecard SARIF'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SARIF file
          path: scorecard-results.sarif
          retention-days: 5
