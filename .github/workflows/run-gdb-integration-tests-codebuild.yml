# CodeBuild counterpart of run-gdb-integration-tests.yml. The composite IP actions handle the primary
# region; secondary-region authorization stays inline until those actions accept a region list. A global
# database bills one cluster per region for the whole run, so this is scheduled weekly rather than nightly.
name: Run Aurora Global Database Integration Tests (CodeBuild)

on:
  workflow_dispatch:
    inputs:
      secondaryRegions:
        description: 'Comma-separated secondary regions for the global database.'
        required: false
        default: 'us-west-2'
      secondaryInstances:
        description: 'Instances per secondary region.'
        required: false
        default: '2'
  schedule:
    # Sundays at 8:00 PM PST (4:00 AM UTC Monday).
    - cron: '0 4 * * 1'

permissions:
  id-token: write
  contents: read

concurrency:
  group: rds-integration-tests-codebuild

env:
  TEST_CONTAINER_REGISTRY: ecr
  TESTCONTAINERS_HOST_OVERRIDE: localhost
  # Workflow steps own the narrow primary- and secondary-region rules for the shared CodeBuild egress IP.
  SKIP_IP_AUTHORIZATION: true

jobs:
  gdb-integration-tests:
    name: 'Run Aurora Global Database integration tests (CodeBuild)'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        testTask: [pg-aurora-global, mysql-aurora-global]
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 50
      - name: 'Set up JDKs'
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: 'corretto'
          java-version: |
            8
            17
      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        id: creds
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: run_gdb_integration_test_codebuild
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
          output-credentials: true
      - name: 'Resolve run parameters'
        id: params
        env:
          INPUT_SECONDARY_REGIONS: ${{ github.event.inputs.secondaryRegions }}
          INPUT_SECONDARY_INSTANCES: ${{ github.event.inputs.secondaryInstances }}
        run: |
          # Defaults precede validation because schedule events have no workflow_dispatch input values.
          REGIONS="${INPUT_SECONDARY_REGIONS:-us-west-2}"
          INSTANCES="${INPUT_SECONDARY_INSTANCES:-2}"
          if ! [[ "$REGIONS" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]; then
            echo "::error::secondaryRegions must be a comma-separated region list, got '$REGIONS'"
            exit 1
          fi
          if ! [[ "$INSTANCES" =~ ^[0-9]+$ ]]; then
            echo "::error::secondaryInstances must be an integer, got '$INSTANCES'"
            exit 1
          fi
          echo "secondaryRegions=$REGIONS" >> "$GITHUB_OUTPUT"
          echo "secondaryInstances=$INSTANCES" >> "$GITHUB_OUTPUT"
      - name: 'Authorize this job''s egress IP address (primary region)'
        id: ip
        uses: ./.github/actions/codebuild-authorize-runner-ip
        with:
          id: ${{ matrix.testTask }}
      - name: 'Record this job''s egress IP address for revoke-runner-ip'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: runner-ip-${{ matrix.testTask }}
          path: ${{ steps.ip.outputs.ip-file }}
          if-no-files-found: error
          retention-days: 1
      - name: 'Authorize this job''s egress IP address (secondary regions)'
        env:
          RUNNER_IPV4: ${{ steps.ip.outputs.ipv4 }}
          SECONDARY_REGIONS: ${{ steps.params.outputs.secondaryRegions }}
        run: |
          description="Test run at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for region in $(echo "$SECONDARY_REGIONS" | tr ',' ' '); do
            for port in 3306 5432; do
              permissions=$(printf '[{"IpProtocol":"tcp","FromPort":%s,"ToPort":%s,"IpRanges":[{"CidrIp":"%s/32","Description":"%s"}]}]' "$port" "$port" "$RUNNER_IPV4" "$description")
              if output=$(aws ec2 authorize-security-group-ingress --region "$region" --group-name default --ip-permissions "$permissions" 2>&1); then
                echo "Authorized TCP $port from $RUNNER_IPV4/32 in $region."
              elif [ "${output#*InvalidPermission.Duplicate}" != "$output" ]; then
                aws ec2 update-security-group-rule-descriptions-ingress --region "$region" --group-name default --ip-permissions "$permissions"
                echo "TCP $port from $RUNNER_IPV4/32 was already authorized in $region; refreshed its description."
              else
                echo "$output"
                exit 1
              fi
            done
          done
      - name: Run Aurora Global Database integration tests
        env:
          MATRIX_TEST_TASK: ${{ matrix.testTask }}
          SECONDARY_REGIONS: ${{ steps.params.outputs.secondaryRegions }}
          SECONDARY_INSTANCES: ${{ steps.params.outputs.secondaryInstances }}
          AURORA_CLUSTER_DOMAIN: ${{ secrets.DB_CONN_SUFFIX }}
          RDS_DB_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}
          MYSQL_VERSION: 'latest'
          PG_VERSION: 'latest'
        run: |
          case "$MATRIX_TEST_TASK" in
            pg-aurora-global) ARGS=("-Dorchestra-engines=postgres" "-Dorchestra-drivers=pg") ;;
            mysql-aurora-global) ARGS=("-Dorchestra-engines=mysql" "-Dorchestra-drivers=mysql,mariadb") ;;
            *) echo "Unknown testTask $MATRIX_TEST_TASK"; exit 1 ;;
          esac
          ./gradlew --no-parallel --no-daemon orchestra-test-rds \
            -Dorchestra-deployment=aurora-global \
            -Dorchestra-secondary-regions="$SECONDARY_REGIONS" \
            -Dorchestra-secondary-instances="$SECONDARY_INSTANCES" \
            "${ARGS[@]}"
      - name: Mask data
        if: ${{ !cancelled() }}
        run: ./gradlew --no-parallel --no-daemon maskJunitHtmlReport
      - name: Archive junit results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: junit-report-gdb-${{ matrix.testTask }}
          path: ./wrapper/build/test-results
          retention-days: 5
      - name: Archive html summary report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: html-summary-report-gdb-${{ matrix.testTask }}
          path: ./wrapper/build/report
          retention-days: 5

  revoke-runner-ip:
    name: 'Revoke runner IP'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    needs: gdb-integration-tests
    if: always()
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: revoke_runner_ip_gdb_codebuild
          role-duration-seconds: 21600
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}
      - name: 'Resolve run parameters'
        id: params
        env:
          INPUT_SECONDARY_REGIONS: ${{ github.event.inputs.secondaryRegions }}
          INPUT_SECONDARY_INSTANCES: ${{ github.event.inputs.secondaryInstances }}
        run: |
          # Keep this defaults-before-validation block identical to the test job's copy.
          REGIONS="${INPUT_SECONDARY_REGIONS:-us-west-2}"
          INSTANCES="${INPUT_SECONDARY_INSTANCES:-2}"
          if ! [[ "$REGIONS" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]; then
            echo "::error::secondaryRegions must be a comma-separated region list, got '$REGIONS'"
            exit 1
          fi
          if ! [[ "$INSTANCES" =~ ^[0-9]+$ ]]; then
            echo "::error::secondaryInstances must be an integer, got '$INSTANCES'"
            exit 1
          fi
          echo "secondaryRegions=$REGIONS" >> "$GITHUB_OUTPUT"
          echo "secondaryInstances=$INSTANCES" >> "$GITHUB_OUTPUT"
      - name: 'Download the recorded egress IP addresses'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: runner-ip-*
          merge-multiple: true
          path: ${{ runner.temp }}/runner-ips
      - name: 'Revoke the recorded egress IP addresses (primary region)'
        uses: ./.github/actions/codebuild-revoke-runner-ips
        with:
          ip-dir: ${{ runner.temp }}/runner-ips
      - name: 'Revoke the recorded egress IP addresses (secondary regions)'
        env:
          RUNNER_IP_DIR: ${{ runner.temp }}/runner-ips
          SECONDARY_REGIONS: ${{ steps.params.outputs.secondaryRegions }}
        run: |
          shopt -s nullglob
          failed=0
          for file in "$RUNNER_IP_DIR"/runner-ip-*.txt; do
            ipv4=$(tr -d '[:space:]' < "$file")
            for region in $(echo "$SECONDARY_REGIONS" | tr ',' ' '); do
              for port in 3306 5432; do
                permissions=$(printf '[{"IpProtocol":"tcp","FromPort":%s,"ToPort":%s,"IpRanges":[{"CidrIp":"%s/32"}]}]' "$port" "$port" "$ipv4")
                if output=$(aws ec2 revoke-security-group-ingress --region "$region" --group-name default --ip-permissions "$permissions" 2>&1); then
                  echo "Revoke of TCP $port from $ipv4/32 in $region accepted."
                elif [ "${output#*InvalidPermission.NotFound}" != "$output" ]; then
                  echo "TCP $port from $ipv4/32 in $region was already revoked."
                else
                  echo "$output"
                  failed=1
                fi
              done
            done
          done
          exit "$failed"
