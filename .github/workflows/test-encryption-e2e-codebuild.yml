# CodeBuild variant of test-encryption-e2e.yml.
#
# Runs the same jobs on the self-hosted CodeBuild runners instead of GitHub-hosted ones.
# Triggers: manual dispatch only.
# There is deliberately no push or pull_request trigger: this repository is public and these
# self-hosted runners hold AWS credentials, so they must never run code from a fork's pull request.
# Shares the rds-integration-tests-codebuild concurrency group with the other CodeBuild RDS
# workflows - see the caution on that group in run-integration-tests-latest-codebuild.yml.

name: End-to-End Encryption Tests (CodeBuild)

on:
  workflow_dispatch:

concurrency:
  # Shared by every CodeBuild RDS workflow, so only one of them at a time claims DB clusters and
  # security-group rules. See run-integration-tests-latest-codebuild.yml for why this is separate
  # from the GitHub-hosted rds-integration-tests group, and for the caution that goes with that.
  # Runs in this group execute one at a time; with `queue: max`, later runs wait in FIFO order
  # (up to 100 pending) instead of being cancelled.
  group: rds-integration-tests-codebuild
  queue: max

permissions:
  contents: read
  id-token: write

env:
  # The CodeBuild runners share outbound IPs and have no Docker Hub credentials, so take the
  # Testcontainers images from ECR Public, which does not rate limit anonymous pulls.
  TEST_CONTAINER_REGISTRY: ecr

  # The runner and its Docker daemon share one container, so Testcontainers would otherwise use
  # the bridge gateway 172.18.0.1, where a published port with no listener (the test container's
  # debug port 5005) is unreachable. Probe run 38786644908 reached every published port at localhost.
  TESTCONTAINERS_HOST_OVERRIDE: localhost

  # The test host does not manage the security group rule here. On-demand CodeBuild without a VPC
  # leaves through a pool of egress addresses, so several jobs share each address and a per-job
  # revoke cuts off its siblings. Instead each matrix job authorizes its own address (stable within
  # a job) and records it, no job revokes, and revoke-runner-ip removes every recorded address once
  # all jobs have finished. The harness's 12-hour sweep reclaims anything that cleanup misses.
  SKIP_IP_AUTHORIZATION: true

jobs:
  test-encryption:
    name: 'Test KMS Encryption End-to-End'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 'Set up JDK 8'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'corretto'
          java-version: 8

      - name: 'Configure AWS credentials'
        id: creds
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: encryption_e2e_test_codebuild
          role-duration-seconds: 7200
          aws-region: ${{ inputs.aws_region || secrets.AWS_DEFAULT_REGION }}
          output-credentials: true

      # Authorizes this job's own egress address (TCP 3306 and 5432 only) and records it for the
      # single revoke-runner-ip job below. See .github/actions/codebuild-authorize-runner-ip.
      - name: 'Authorize this job''s egress IP address'
        id: ip
        uses: ./.github/actions/codebuild-authorize-runner-ip
        with:
          id: test-encryption

      - name: 'Record this job''s egress IP address for revoke-runner-ip'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-ip-test-encryption
          path: ${{ steps.ip.outputs.ip-file }}
          if-no-files-found: error
          retention-days: 1

      - name: 'Check for Cached KMS Key'
        id: check-cached-key
        if: inputs.force_new_key != true
        run: |
          # Look for existing test key by alias
          KEY_ID=$(aws kms list-aliases \
            --query "Aliases[?AliasName=='alias/jdbc-encryption-key'].TargetKeyId" \
            --output text 2>/dev/null || echo "")

          if [ -n "$KEY_ID" ]; then
            # Verify key is enabled
            KEY_STATE=$(aws kms describe-key --key-id "$KEY_ID" \
              --query 'KeyMetadata.KeyState' --output text 2>/dev/null || echo "")

            if [ "$KEY_STATE" == "Enabled" ]; then
              echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT
              echo "key_exists=true" >> $GITHUB_OUTPUT
              echo "Found cached KMS Key: $KEY_ID"
            else
              echo "key_exists=false" >> $GITHUB_OUTPUT
              echo "Cached key exists but is not enabled"
            fi
          else
            echo "key_exists=false" >> $GITHUB_OUTPUT
            echo "No cached key found"
          fi

      - name: 'Create KMS Master Key'
        id: create-kms-key
        if: steps.check-cached-key.outputs.key_exists != 'true'
        run: |
          KEY_ID=$(aws kms create-key \
            --description "JDBC Encryption Test Key (Cached)" \
            --key-usage ENCRYPT_DECRYPT \
            --key-spec SYMMETRIC_DEFAULT \
            --tags TagKey=Project,TagValue=aws-jdbc-wrapper TagKey=Purpose,TagValue=testing \
            --query 'KeyMetadata.KeyId' \
            --output text)
          echo "key_id=$KEY_ID" >> $GITHUB_OUTPUT
          echo "Created KMS Key: $KEY_ID"

          # Create persistent alias
          aws kms create-alias \
            --alias-name "alias/jdbc-encryption-key" \
            --target-key-id "$KEY_ID"

          # Enable key rotation
          aws kms enable-key-rotation --key-id "$KEY_ID"

      - name: 'Set Active Key ID'
        id: active-key
        run: |
          if [ "${{ steps.check-cached-key.outputs.key_exists }}" == "true" ]; then
            echo "key_id=${{ steps.check-cached-key.outputs.key_id }}" >> $GITHUB_OUTPUT
            echo "Using cached key: ${{ steps.check-cached-key.outputs.key_id }}"
          else
            echo "key_id=${{ steps.create-kms-key.outputs.key_id }}" >> $GITHUB_OUTPUT
            echo "Using newly created key: ${{ steps.create-kms-key.outputs.key_id }}"
          fi

      - name: 'Generate Data Key'
        id: generate-data-key
        run: |
          # Generate a data key using the master key
          DATA_KEY_RESPONSE=$(aws kms generate-data-key \
            --key-id ${{ steps.active-key.outputs.key_id }} \
            --key-spec AES_256 \
            --output json)

          PLAINTEXT_KEY=$(echo "$DATA_KEY_RESPONSE" | jq -r '.Plaintext')
          CIPHERTEXT_BLOB=$(echo "$DATA_KEY_RESPONSE" | jq -r '.CiphertextBlob')

          # Mask sensitive values in logs
          echo "::add-mask::$PLAINTEXT_KEY"
          echo "::add-mask::$CIPHERTEXT_BLOB"

          # Store as step outputs (masked in logs)
          echo "plaintext_key=$PLAINTEXT_KEY" >> $GITHUB_OUTPUT
          echo "ciphertext_blob=$CIPHERTEXT_BLOB" >> $GITHUB_OUTPUT
          echo "Data key generated successfully"

      - name: 'Test Data Key Decryption'
        run: |
          # Decrypt the data key to verify it works
          DECRYPTED_KEY=$(aws kms decrypt \
            --ciphertext-blob fileb://<(echo "${{ steps.generate-data-key.outputs.ciphertext_blob }}" | base64 -d) \
            --key-id ${{ steps.active-key.outputs.key_id }} \
            --query 'Plaintext' \
            --output text)

          if [ "$DECRYPTED_KEY" == "${{ steps.generate-data-key.outputs.plaintext_key }}" ]; then
            echo "✓ Data key decryption successful"
          else
            echo "✗ Data key decryption failed"
            exit 1
          fi

      - name: 'Build and Test Encryption Plugin'
        run: |
          ./gradlew --no-parallel --no-daemon test-kms-encryption
        env:
          KMS_KEY_ID: ${{ steps.active-key.outputs.key_id }}
          AWS_REGION: ${{ inputs.aws_region || secrets.AWS_DEFAULT_REGION }}
          AWS_ACCESS_KEY_ID: ${{ steps.creds.outputs.aws-access-key-id }}
          AWS_SECRET_ACCESS_KEY: ${{ steps.creds.outputs.aws-secret-access-key }}
          AWS_SESSION_TOKEN: ${{ steps.creds.outputs.aws-session-token }}

      - name: 'Verify Key Metadata'
        run: |
          # Describe the key to verify all properties
          aws kms describe-key \
            --key-id ${{ steps.active-key.outputs.key_id }} \
            --output json | jq '{
              KeyId: .KeyMetadata.KeyId,
              KeyState: .KeyMetadata.KeyState,
              KeyUsage: .KeyMetadata.KeyUsage,
              KeySpec: .KeyMetadata.KeySpec,
              Enabled: .KeyMetadata.Enabled
            }'

      - name: 'Cleanup - Schedule Key Deletion'
        if: false  # Disabled - key is cached for reuse
        run: |
          # Key is intentionally kept for reuse across test runs
          # To manually delete: aws kms schedule-key-deletion --key-id <KEY_ID> --pending-window-in-days 7
          echo "KMS key retained for future test runs"

      - name: 'Upload Test Results'
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: encryption-test-results
          path: |
            wrapper/build/reports/tests/
            wrapper/build/test-results/
          retention-days: 7

      # There is deliberately no security-group cleanup step here. Other jobs may share this job's
      # address and rule, so revoke-runner-ip below removes it once every job has finished.

  # The single revoke for the whole run, after every test job has finished, whatever its outcome.
  # A per-job revoke would take a shared rule away from jobs still using it. See
  # .github/actions/codebuild-revoke-runner-ips.
  revoke-runner-ip:
    name: 'Revoke runner IP'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    needs: test-encryption
    if: always()
    steps:
      - name: 'Clone repository'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 'Configure AWS credentials'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        id: creds
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_DEPLOY_ROLE }}
          role-session-name: revoke_runner_ip_encryption_e2e
          role-duration-seconds: 7200
          aws-region: ${{ inputs.aws_region || secrets.AWS_DEFAULT_REGION }}
          output-credentials: true

      # A pattern that matches no artifact downloads nothing and succeeds; the revoke step then
      # finds no files and exits 0. Any other download failure fails this job visibly, and the
      # 12-hour sweep reclaims the rules it would have revoked.
      - name: 'Download the recorded egress IP addresses'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runner-ip-*
          merge-multiple: true
          path: ${{ runner.temp }}/runner-ips

      - name: 'Revoke the recorded egress IP addresses'
        uses: ./.github/actions/codebuild-revoke-runner-ips
        with:
          ip-dir: ${{ runner.temp }}/runner-ips
