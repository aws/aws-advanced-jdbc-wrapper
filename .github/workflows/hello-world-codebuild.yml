# Smoke test for the self-hosted CodeBuild runners.
#
# Runs no tests and touches no AWS resources. It answers three questions that the integration
# test workflows depend on and that their logs cannot answer cheaply:
#
#   1. Does the fleet provision a runner that picks a job up and reports back?
#   2. What egress address does a job have? The integration tests authorize this address in the
#      region's default security group, and run 38623414788 showed all 20 jobs sharing only four
#      of them. Dispatch this workflow a few times: if the addresses repeat, they are stable and
#      can be allow-listed permanently instead of being authorized and revoked per job.
#   3. Are the container images the tests pull actually available to this runner? With
#      TEST_CONTAINER_REGISTRY=ecr the suite takes the Docker Official Images from the ECR Public
#      mirror (see wrapper/src/test/java/integration/util/ContainerImages.java). Whether every
#      pinned tag exists there is an assumption until a pull proves it.
#
# It also sleeps for a minute so a run is long enough to observe in the Actions UI and in the
# CodeBuild console. Manual dispatch only.

name: Hello World (CodeBuild)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hello-world:
    name: 'Hello World'
    runs-on: codebuild-jdbcWrapper-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 30
    steps:
      - name: Say hello
        run: |
          echo "Hello from $(hostname) on $(uname -srm)"
          echo "Runner: ${RUNNER_NAME:-unknown} (${RUNNER_OS}/${RUNNER_ARCH})"
          echo "Workflow: ${GITHUB_WORKFLOW} run ${GITHUB_RUN_ID} attempt ${GITHUB_RUN_ATTEMPT}"

      # The integration test host discovers this same address via checkip.amazonaws.com and adds
      # it as a /32 rule to the region's default security group, so it decides whether the
      # authorize/revoke-per-job model works on this fleet at all.
      - name: Report the runner's egress address
        run: |
          ip=$(curl -fsS --max-time 10 https://checkip.amazonaws.com | tr -d '[:space:]' || true)
          if [ -n "$ip" ]; then
            echo "Egress address (checkip.amazonaws.com): $ip"
          else
            echo "WARNING: could not reach checkip.amazonaws.com; the test host uses the same" \
                 "endpoint to discover the address it authorizes, so it would fail here too."
          fi

      # Every image the suite pulls when TEST_CONTAINER_REGISTRY=ecr is set. A missing mirror or
      # an unmirrored tag fails this step by name instead of surfacing mid-suite as an opaque
      # Testcontainers error.
      - name: Verify the ECR Public images are pullable
        run: |
          images="
          public.ecr.aws/docker/library/amazoncorretto:8-alpine
          public.ecr.aws/docker/library/amazoncorretto:11.0.19-alpine3.17
          public.ecr.aws/docker/library/amazoncorretto:17-alpine3.21
          public.ecr.aws/docker/library/amazoncorretto:21-alpine-full
          public.ecr.aws/docker/library/amazoncorretto:24-alpine-full
          public.ecr.aws/docker/library/mysql:8.0.31
          public.ecr.aws/docker/library/postgres:latest
          public.ecr.aws/docker/library/mariadb:10
          public.ecr.aws/valkey/valkey:8.1
          public.ecr.aws/xray/aws-xray-daemon:latest
          public.ecr.aws/aws-observability/aws-otel-collector:latest
          "
          failed=""
          for image in $images; do
            echo "--- pulling $image"
            if docker pull --quiet "$image" > /dev/null 2>&1; then
              digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}' 2>/dev/null \
                || echo "(no digest reported)")
              echo "OK       $image -> $digest"
            else
              echo "FAILED   $image"
              docker pull "$image" 2>&1 | tail -5 || true
              failed="$failed $image"
            fi
          done
          if [ -n "$failed" ]; then
            echo "Images unavailable from ECR Public:$failed"
            exit 1
          fi
          echo "All ECR Public images pulled successfully."

      # These three are NOT redirected by TEST_CONTAINER_REGISTRY. toxiproxy and GraalVM come from
      # GitHub's registry, which has no Docker Hub pull limit. postgis has no ECR Public mirror in
      # ContainerImages, so it still comes from Docker Hub even in ECR mode - that residual
      # exposure to the anonymous pull limit should be visible here rather than inferred.
      # Reported, not enforced: a Docker Hub limit here must not mask the ECR results above.
      - name: Check the images the registry switch does not redirect
        continue-on-error: true
        run: |
          for image in \
            ghcr.io/shopify/toxiproxy:2.11.0 \
            ghcr.io/graalvm/jdk:22.2.0 \
            postgis/postgis:16-3.4
          do
            echo "--- pulling $image"
            if docker pull --quiet "$image" > /dev/null 2>&1; then
              echo "OK       $image"
            else
              echo "FAILED   $image"
              docker pull "$image" 2>&1 | tail -5 || true
            fi
          done

      - name: Simulate work
        run: |
          echo "Sleeping for 60 seconds..."
          sleep 60
          echo "Done."
